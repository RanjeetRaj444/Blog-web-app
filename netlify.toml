[build]
  base = "project"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Sitemap is generated by the API (published posts only)
[[redirects]]
  from = "/sitemap.xml"
  to = "https://blog-web-app-qbiy.onrender.com/sitemap.xml"
  status = 200
  force = true

# Single-page app fallback (React Router)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
